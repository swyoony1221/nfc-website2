<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>오늘 뭐 먹지? — 푸드 가챠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --g1: #7c83fd; --g2: #4d5bf9; --g3: #9d7bff;
    --bg-deep: #0a0a0e; --panel: #17171d; --panel-2: #1e1e26;
    --ink: #f4f3f6; --ink-dim: #9a99a6; --line: rgba(255,255,255,0.09);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    margin: 0; background: var(--bg-deep); color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif; overflow: hidden; position: fixed; inset: 0; width: 100%;
  }

  #app { position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(circle at 22% 8%, color-mix(in srgb, var(--g1) 20%, var(--bg-deep)) 0%, var(--bg-deep) 60%);
    transition: background 0.7s ease; }

  .track { display: flex; width: 600%; height: 100%;
    transform: translateX(calc(var(--step, 0) * -16.6667%));
    transition: transform 0.5s cubic-bezier(.22,.9,.28,1); }

  .screen { width: 16.6667%; height: 100%; flex-shrink: 0; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* ---- header ---- */
  .scr-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; flex-shrink: 0; min-height: 40px; }
  .back-chev { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .back-chev.hidden { visibility: hidden; }
  .head-titles { flex: 1; min-width: 0; }
  .head-titles .t { font-family: 'Jua', sans-serif; font-size: 18px; line-height: 1.3; }
  .head-titles .s { font-size: 11.5px; color: var(--ink-dim); margin-top: 1px; }
  .dots { display: flex; gap: 5px; flex-shrink: 0; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background 0.3s, transform 0.3s; }
  .dots span.on { background: linear-gradient(120deg, var(--g1), var(--g2)); transform: scale(1.3); }

  /* ---- filter content ---- */
  .scr-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 16px 6px; display: flex; flex-direction: column; justify-content: center; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-family: inherit; font-size: 15px; padding: 13px 18px; border-radius: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 84px;
    transition: transform 0.15s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .chip .ico { font-size: 26px; }
  .chip:active { transform: scale(0.94); }
  .chip.on { background: linear-gradient(150deg, color-mix(in srgb, var(--g1) 88%, transparent), color-mix(in srgb, var(--g2) 88%, transparent));
    border-color: transparent; color: #fff; font-weight: 700;
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--g2) 70%, transparent); }

  .scr-footer { flex-shrink: 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom,0px)); display: flex; flex-direction: column; gap: 10px; }
  .nav-row { display: flex; gap: 10px; }
  .btn { flex: 1; border: none; border-radius: 100px; padding: 15px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700;
    font-size: 15px; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
  .btn.primary { background: linear-gradient(120deg, var(--g1), var(--g2)); color: #fff; }
  .link-btn { background: none; border: none; color: var(--ink-dim); font-size: 12.5px; text-align: center; text-decoration: underline; cursor: pointer; padding: 2px; }

  /* ---- review screen ---- */
  .review-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 8px 20px; overflow-y: auto; }
  .review-block .rb-label { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 6px; }
  .review-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
  .review-tag { font-size: 12.5px; padding: 5px 11px; border-radius: 100px; background: var(--panel-2); border: 1px solid var(--line); }
  .review-tag.empty { color: var(--ink-dim); font-style: normal; }
  .pool-box { text-align: center; margin-top: 4px; padding: 14px; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--line); }
  .pool-box .num { font-family: 'Jua', sans-serif; font-size: 30px; background: linear-gradient(120deg, var(--g1), var(--g3));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pool-box .lbl { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .relax-note { text-align: center; font-size: 11.5px; color: var(--ink-dim); margin-top: -4px; line-height: 1.5; }

  /* ---- draw pack button (review + fab) ---- */
  .pack-btn { width: 100%; border: none; cursor: pointer; font-family: 'Jua', sans-serif; font-size: 19px; color: #fff;
    padding: 17px; border-radius: 100px; background: linear-gradient(120deg, var(--g1), var(--g3) 55%, var(--g2));
    box-shadow: 0 14px 28px -10px color-mix(in srgb, var(--g2) 65%, transparent), inset 0 1px 0 rgba(255,255,255,0.35); }
  .pack-btn:active { transform: scale(0.96); }
  .pack-btn .sub { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 500; opacity: 0.85; margin-top: 2px; }

  #fab { position: absolute; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom,0px)); z-index: 20;
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(140deg, var(--g1), var(--g2)); color: #fff; font-size: 24px;
    box-shadow: 0 12px 26px -8px color-mix(in srgb, var(--g2) 75%, transparent), inset 0 1px 0 rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center; transition: transform 0.15s ease, opacity 0.3s ease, background 0.7s ease; }
  #fab:active { transform: scale(0.9); }
  #fab.hide { opacity: 0; pointer-events: none; transform: scale(0.6); }

  /* ---- result screen ---- */
  .result-screen { align-items: stretch; }
  .result-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 16px; perspective: 1400px; }
  .card-perspective { height: min(58dvh, 430px); aspect-ratio: 63 / 92; perspective: 1400px; touch-action: none; position: relative; }
  .tilt { width: 100%; height: 100%; transform-style: preserve-3d; will-change: transform; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.2,.9,.25,1); cursor: pointer; }
  .card.pop { animation: pop-in 0.55s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop-in {
    0% { transform: scale(0.25) rotateZ(-10deg); opacity: 0; }
    60% { transform: scale(1.07) rotateZ(2deg); opacity: 1; }
    100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
  }
  .card.flipped { transform: rotateY(180deg); }

  .face { position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; overflow: hidden;
    border: 2px solid color-mix(in srgb, var(--g1) 55%, #fff 12%);
    box-shadow: 0 24px 50px -18px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.05),
      0 0 34px -6px color-mix(in srgb, var(--g2) 45%, transparent);
    background: var(--panel); transition: box-shadow 0.4s ease; }
  .face.back { transform: rotateY(180deg); }
  .face-inner { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 1; }

  .front { background: linear-gradient(155deg, color-mix(in srgb, var(--g1) 30%, #101014), #101014 60%); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; padding: 11px 12px 0; }
  .genre-badge { font-size: 10px; font-weight: 700; padding: 4px 9px; border-radius: 100px;
    background: linear-gradient(120deg, var(--g1), var(--g2)); color: #fff; }
  .hp-badge { font-size: 10.5px; color: var(--ink-dim); font-weight: 700; }
  .art-frame { margin: 7px 11px 0; height: 40%; border-radius: 12px;
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--g3) 35%, #1a1a22), #101014 80%);
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); }
  .art-emoji { font-size: 62px; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); }
  .name-row { padding: 10px 13px 0; }
  .food-name { font-family: 'Jua', sans-serif; font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .tag-row { display: flex; gap: 5px; flex-wrap: wrap; padding: 6px 13px 0; }
  .mini-tag { font-size: 9.5px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 100px; padding: 2px 7px; }
  .flavor-text { margin: 8px 13px 0; font-size: 11.5px; line-height: 1.5; color: #d8d7de; flex: 1; }
  .card-footer { padding: 7px 13px 11px; font-size: 9.5px; color: var(--ink-dim); display: flex; justify-content: space-between;
    border-top: 1px solid var(--line); margin-top: auto; }

  .back-inner { padding: 18px 17px; display: flex; flex-direction: column; height: 100%;
    background: linear-gradient(160deg, #15151b, #0e0e12 70%); }
  .back-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .back-emoji { font-size: 27px; }
  .back-title { font-family: 'Jua', sans-serif; font-size: 16.5px; }
  .stat-line { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .stat-line .k { color: var(--ink-dim); }
  .stat-line .v { font-weight: 700; }
  .kcal-big { text-align: center; margin: 8px 0 10px; }
  .kcal-big .num { font-family: 'Jua', sans-serif; font-size: 30px; background: linear-gradient(120deg, var(--g1), var(--g3));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kcal-big .unit { font-size: 11px; color: var(--ink-dim); }
  .detail-text { font-size: 11.5px; line-height: 1.6; color: #c9c8d0; flex: 1; overflow-y: auto; }

  /* ---- holographic foil layers ---- */
  .foil { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; z-index: 2; }
  .foil-grain {
    background-image:
      repeating-radial-gradient(circle at 15% 20%, rgba(255,255,255,0.55) 0px, transparent 1px, transparent 5px),
      repeating-radial-gradient(circle at 65% 75%, rgba(255,255,255,0.4) 0px, transparent 1px, transparent 6px),
      repeating-radial-gradient(circle at 85% 15%, rgba(255,255,255,0.35) 0px, transparent 1px, transparent 7px);
    mix-blend-mode: screen; opacity: 0.22;
  }
  .foil-rainbow {
    background: conic-gradient(from calc(var(--ang,0) * 1deg) at var(--mx,50%) var(--my,50%),
      #ff6b6b, #ffd166, #b8ff6b, #6bffc0, #6bd6ff, #9d6bff, #ff6bd6, #ff6b6b);
    mix-blend-mode: screen;
    opacity: calc(0.20 + var(--intensity,0) * 0.22);
    mask-image: radial-gradient(circle at var(--mx,50%) var(--my,50%), black 0%, black 28%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at var(--mx,50%) var(--my,50%), black 0%, black 28%, transparent 78%);
    transition: opacity 0.25s ease;
  }
  .foil-sparkle {
    background-image: repeating-conic-gradient(from calc(var(--ang,0) * 2deg) at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,0.95) 0deg 1deg, transparent 1deg 8deg);
    mix-blend-mode: screen;
    opacity: calc(0.28 + var(--intensity,0) * 0.42);
    mask-image: radial-gradient(circle at var(--mx,50%) var(--my,50%), black 0%, transparent 40%);
    -webkit-mask-image: radial-gradient(circle at var(--mx,50%) var(--my,50%), black 0%, transparent 40%);
    transition: opacity 0.25s ease;
  }
  .foil-glare {
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.85), rgba(255,255,255,0.1) 32%, transparent 62%);
    mix-blend-mode: screen;
    opacity: calc(0.5 + var(--intensity,0) * 0.35);
    transition: opacity 0.25s ease;
  }
  .card.pop .foil-rainbow, .card.pop .foil-sparkle, .card.pop .foil-glare { animation: intro-sweep 1.4s ease-out 1; }
  @keyframes intro-sweep {
    0% { opacity: 0; }
    35% { opacity: 0.9; }
    100% { opacity: inherit; }
  }

  .result-actions { flex-shrink: 0; padding: 8px 20px calc(14px + env(safe-area-inset-bottom,0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .result-btn-row { display: flex; gap: 10px; width: 100%; }
  .gyro-btn { background: none; border: none; color: var(--ink-dim); font-size: 11.5px; cursor: pointer; text-decoration: underline; padding: 2px; }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
    background: #232329; border: 1px solid var(--line); color: var(--ink); padding: 11px 18px; border-radius: 100px;
    font-size: 13px; opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; z-index: 50; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .card.pop, .track, .tilt { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="track" id="track">

    <!-- Step 0: 장르 -->
    <section class="screen" data-step="0">
      <div class="scr-head">
        <button class="back-chev hidden"><span>‹</span></button>
        <div class="head-titles"><div class="t">어떤 장르가 좋아요?</div><div class="s">여러 개 골라도 되고, 안 골라도 돼요</div></div>
        <div class="dots"><span class="on"></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="scr-body"><div class="chip-grid" data-chips="genre"></div></div>
      <div class="scr-footer">
        <div class="nav-row"><button class="btn primary" data-next>다음</button></div>
      </div>
    </section>

    <!-- Step 1: 종류 -->
    <section class="screen" data-step="1">
      <div class="scr-head">
        <button class="back-chev" data-back><span>‹</span></button>
        <div class="head-titles"><div class="t">면? 밥? 국?</div><div class="s">먹고 싶은 형태를 골라보세요</div></div>
        <div class="dots"><span></span><span class="on"></span><span></span><span></span><span></span></div>
      </div>
      <div class="scr-body"><div class="chip-grid" data-chips="type"></div></div>
      <div class="scr-footer">
        <div class="nav-row"><button class="btn primary" data-next>다음</button></div>
      </div>
    </section>

    <!-- Step 2: 온도 -->
    <section class="screen" data-step="2">
      <div class="scr-head">
        <button class="back-chev" data-back><span>‹</span></button>
        <div class="head-titles"><div class="t">뜨거운 거? 차가운 거?</div><div class="s">오늘 날씨에 맞는 걸로</div></div>
        <div class="dots"><span></span><span></span><span class="on"></span><span></span><span></span></div>
      </div>
      <div class="scr-body"><div class="chip-grid" data-chips="temp"></div></div>
      <div class="scr-footer">
        <div class="nav-row"><button class="btn primary" data-next>다음</button></div>
      </div>
    </section>

    <!-- Step 3: 맛 -->
    <section class="screen" data-step="3">
      <div class="scr-head">
        <button class="back-chev" data-back><span>‹</span></button>
        <div class="head-titles"><div class="t">맛은 어떻게 할까요?</div><div class="s">여러 개 골라도 돼요</div></div>
        <div class="dots"><span></span><span></span><span></span><span class="on"></span><span></span></div>
      </div>
      <div class="scr-body"><div class="chip-grid" data-chips="taste"></div></div>
      <div class="scr-footer">
        <div class="nav-row"><button class="btn primary" data-next>다음</button></div>
      </div>
    </section>

    <!-- Step 4: 확인 & 뽑기 -->
    <section class="screen" data-step="4">
      <div class="scr-head">
        <button class="back-chev" data-back><span>‹</span></button>
        <div class="head-titles"><div class="t">이대로 뽑을까요?</div><div class="s">고른 조건이에요</div></div>
        <div class="dots"><span></span><span></span><span></span><span></span><span class="on"></span></div>
      </div>
      <div class="review-body">
        <div class="review-block"><div class="rb-label">장르</div><div class="review-tags" id="rv-genre"></div></div>
        <div class="review-block"><div class="rb-label">종류</div><div class="review-tags" id="rv-type"></div></div>
        <div class="review-block"><div class="rb-label">온도</div><div class="review-tags" id="rv-temp"></div></div>
        <div class="review-block"><div class="rb-label">맛</div><div class="review-tags" id="rv-taste"></div></div>
        <div class="pool-box"><div class="num" id="poolNum">50</div><div class="lbl">개 중에서 한 장을 뽑아요</div></div>
        <div class="relax-note" id="poolRelaxNote" style="display:none;"></div>
      </div>
      <div class="scr-footer">
        <button class="pack-btn" id="drawBtn">카드팩 열기<span class="sub">랜덤으로 한 장 뽑기</span></button>
        <button class="link-btn" id="clearBtn">필터 초기화</button>
      </div>
    </section>

    <!-- Step 5: 결과 카드 -->
    <section class="screen result-screen" data-step="5">
      <div class="scr-head">
        <button class="back-chev" data-back><span>‹</span></button>
        <div class="head-titles"><div class="t">오늘의 메뉴</div><div class="s">카드를 탭하면 뒤집혀요</div></div>
        <div style="width:34px"></div>
      </div>
      <div class="result-body">
        <div class="card-perspective" id="cardPersp">
          <div class="tilt" id="tilt">
            <div class="card" id="card">
              <div class="face front">
                <div class="face-inner">
                  <div class="card-top"><span class="genre-badge" id="cGenre">한식</span><span class="hp-badge" id="cKcalTop">320 kcal</span></div>
                  <div class="art-frame"><span class="art-emoji" id="cEmoji">🍲</span></div>
                  <div class="name-row"><h2 class="food-name" id="cName">음식 이름</h2></div>
                  <div class="tag-row" id="cTags"></div>
                  <p class="flavor-text" id="cShort">설명</p>
                  <div class="card-footer"><span id="cFooterLeft">No. 01</span><span>탭해서 뒤집기 ↻</span></div>
                </div>
                <div class="foil foil-grain"></div>
                <div class="foil foil-rainbow"></div>
                <div class="foil foil-sparkle"></div>
                <div class="foil foil-glare"></div>
              </div>
              <div class="face back">
                <div class="back-inner">
                  <div class="back-head"><span class="back-emoji" id="cEmojiBack">🍲</span><span class="back-title" id="cNameBack">음식 이름</span></div>
                  <div class="kcal-big"><span class="num" id="cKcal">320</span><span class="unit"> kcal / 1인분</span></div>
                  <div class="stat-line"><span class="k">장르</span><span class="v" id="cGenreBack">한식</span></div>
                  <div class="stat-line"><span class="k">종류</span><span class="v" id="cTypeBack">국·탕</span></div>
                  <div class="stat-line"><span class="k">온도</span><span class="v" id="cTempBack">뜨거운 음식</span></div>
                  <p class="detail-text" id="cDetail">상세 설명</p>
                </div>
                <div class="foil foil-grain"></div>
                <div class="foil foil-rainbow"></div>
                <div class="foil foil-sparkle"></div>
                <div class="foil foil-glare"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="result-actions">
        <div class="result-btn-row">
          <button class="btn ghost" id="changeBtn">조건 변경</button>
          <button class="btn primary" id="againBtn">다시 뽑기</button>
        </div>
        <button class="gyro-btn" id="gyroBtn">📱 기울여서 반짝이기 (자이로 켜기)</button>
      </div>
    </section>

  </div>

  <button id="fab" title="지금 바로 랜덤 뽑기">⚡</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Data ---------------- */
const GENRES = {
  '한식': { g1:'#ff5f5f', g2:'#ff9d4d', g3:'#ffb37a' },
  '중식': { g1:'#e2231a', g2:'#ffca28', g3:'#ff7043' },
  '일식': { g1:'#ff8fab', g2:'#c9184a', g3:'#ffb3c6' },

/* ---------------- State ---------------- */
const state = { genre: new Set(), type: new Set(), temp: new Set(), taste: new Set() };
let currentStep = 0;
let gyroOn = false;

const cur = { x: 0, y: 0 };

const app = document.getElementById('app');

/* ---------------- Build filter chips ---------------- */
function buildChips(group, options, iconMap) {
  const row = document.querySelector(`[data-chips="${group}"]`);
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.type = 'button';
    btn.innerHTML = `<span class="ico">${iconMap[opt]}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => {
      if (state[group].has(opt)) { state[group].delete(opt); btn.classList.remove('on'); }
      else { state[group].add(opt); btn.classList.add('on'); }
      previewTheme();
    });
    row.appendChild(btn);
  });
}
buildChips('genre', Object.keys(GENRES), GENRE_ICON);
buildChips('type', ['면','밥','국','기타'], TYPE_ICON);
buildChips('temp', ['뜨거운','차가운'], TEMP_ICON);
buildChips('taste', ['매운','짠','단','심플'], TASTE_ICON);

function previewTheme() {
  if (state.genre.size === 0) { setTheme(DEFAULT_THEME); return; }
  const last = [...state.genre][state.genre.size - 1];
  setTheme(GENRES[last]);
}

/* ---------------- Pool (with auto-relax so results never go below MIN_POOL) ---------------- */
const MIN_POOL = 5;
const RELAX_ORDER = ['taste', 'temp', 'type', 'genre']; // 이 순서대로 하나씩 조건을 풀어줌
const GROUP_LABEL = { genre: '장르', type: '종류', temp: '온도', taste: '맛' };

function filterWith(active) {
  return FOODS.filter(f => {
    if (active.genre.size && !active.genre.has(f.genre)) return false;
    if (active.type.size && !active.type.has(f.type)) return false;
    if (active.temp.size && !active.temp.has(f.temp)) return false;
    if (active.taste.size && !f.taste.some(t => active.taste.has(t))) return false;
    return true;
  });
}

// 선택한 조건 그대로 걸러낸 "엄격한" 풀 (요약 화면에 참고용으로만 사용)
function computePool() {
  return filterWith(state);
}

// 실제 뽑기에 쓰는 풀: 결과가 MIN_POOL 미만이면 태그 -> 온도 -> 종류 -> 장르 순으로
// 조건을 하나씩 완화해서 최소 개수를 보장한다.
function getEffectivePool() {
  const active = {
    genre: new Set(state.genre), type: new Set(state.type),
    temp: new Set(state.temp), taste: new Set(state.taste),
  };
  let pool = filterWith(active);
  const relaxed = [];
  let i = 0;
  while (pool.length < MIN_POOL && i < RELAX_ORDER.length) {
    const key = RELAX_ORDER[i];
    if (active[key].size > 0) {
      active[key] = new Set();
      relaxed.push(key);
      pool = filterWith(active);
    }
    i++;
  }
  return { pool, relaxed };
}

/* ---------------- Theme ---------------- */
function setTheme(t) {
  const root = document.documentElement.style;
  root.setProperty('--g1', t.g1); root.setProperty('--g2', t.g2); root.setProperty('--g3', t.g3);
}

/* ---------------- Toast ---------------- */
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------------- Step navigation ---------------- */
const screens = document.querySelectorAll('.screen');
function goTo(step) {
  currentStep = step;
  track.style.setProperty('--step', step);
  fab.classList.toggle('hide', step === 5);
  if (step === 4) renderReview();
  if (step === 5) startTiltLoop(); else stopTiltLoop();
}
document.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => goTo(Math.min(currentStep + 1, 4))));
document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => goTo(Math.max(currentStep - 1, 0))));

function renderReview() {
  const { pool, relaxed } = getEffectivePool();
  document.getElementById('poolNum').textContent = pool.length;
  const noteEl = document.getElementById('poolRelaxNote');
  if (relaxed.length > 0) {
    const names = relaxed.map(k => GROUP_LABEL[k]).join(', ');
    noteEl.textContent = `※ 조건에 맞는 게 적어서 ${names} 조건은 잠시 넓혔어요`;
    noteEl.style.display = 'block';
  } else {
    noteEl.style.display = 'none';
  }
  const mapGroups = [
    ['rv-genre', 'genre', GENRE_ICON], ['rv-type', 'type', TYPE_ICON],
    ['rv-temp', 'temp', TEMP_ICON], ['rv-taste', 'taste', TASTE_ICON],
  ];
  mapGroups.forEach(([id, group, icon]) => {
    const box = document.getElementById(id);
    box.innerHTML = '';
    if (state[group].size === 0) {
      const s = document.createElement('span');
      s.className = 'review-tag empty'; s.textContent = '전체';
      box.appendChild(s);
    } else {
      [...state[group]].forEach(v => {
        const s = document.createElement('span');
        s.className = 'review-tag'; s.textContent = `${icon[v]} ${v}`;
        box.appendChild(s);
      });
    }
  });
}

document.getElementById('clearBtn').addEventListener('click', () => {
  Object.keys(state).forEach(g => state[g].clear());
  document.querySelectorAll('.chip.on').forEach(c => c.classList.remove('on'));
  setTheme(DEFAULT_THEME);
  renderReview();
});
document.getElementById('changeBtn').addEventListener('click', () => goTo(4));

/* ---------------- Draw ---------------- */
function draw() {
  const { pool, relaxed } = getEffectivePool();
  if (pool.length === 0) { showToast('조건에 맞는 음식이 없어요. 필터를 줄여보세요 🙏'); return; }
  if (relaxed.length > 0) {
    const names = relaxed.map(k => GROUP_LABEL[k]).join(', ');
    showToast(`조건이 너무 좁아서 ${names} 조건은 잠시 풀고 뽑았어요`);
  }
  const food = pool[Math.floor(Math.random() * pool.length)];
  setTheme(GENRES[food.genre]);
  renderCard(food);
  goTo(5);
  cardEl.classList.remove('flipped');
  cardEl.classList.remove('pop');
  void cardEl.offsetWidth;
  cardEl.classList.add('pop');
  target.x = 0; target.y = 0; cur.x = 0; cur.y = 0;
  applyTilt(0, 0);
}
function renderCard(f) {
  document.getElementById('cGenre').textContent = f.genre;
  document.getElementById('cKcalTop').textContent = `${f.kcal} kcal`;
  document.getElementById('cEmoji').textContent = f.emoji;
  document.getElementById('cEmojiBack').textContent = f.emoji;
  document.getElementById('cName').textContent = f.name;
  document.getElementById('cNameBack').textContent = f.name;
  document.getElementById('cShort').textContent = f.short;
  document.getElementById('cDetail').textContent = f.detail;
  document.getElementById('cKcal').textContent = f.kcal;
  document.getElementById('cGenreBack').textContent = f.genre;
  document.getElementById('cTypeBack').textContent = TYPE_LABEL[f.type];
  document.getElementById('cTempBack').textContent = TEMP_LABEL[f.temp];
  document.getElementById('cFooterLeft').textContent = `No. ${String(FOODS.indexOf(f) + 1).padStart(2,'0')}`;
  const tagRow = document.getElementById('cTags');
  tagRow.innerHTML = '';
  [f.type, f.temp, ...f.taste].forEach(t => {
    const s = document.createElement('span'); s.className = 'mini-tag'; s.textContent = t; tagRow.appendChild(s);
  });
}
document.getElementById('drawBtn').addEventListener('click', draw);
document.getElementById('againBtn').addEventListener('click', draw);
fab.addEventListener('click', draw);
cardEl.addEventListener('click', () => cardEl.classList.toggle('flipped'));

/* ---------------- Tilt / holo (pointer + gyro, eased) ---------------- */
function applyTilt(x, y) {
  const rotY = x * 16, rotX = -y * 16;
  tiltEl.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  const mx = 50 + x * 50, my = 50 + y * 50;
  const ang = Math.atan2(y, x) * 180 / Math.PI;
  const intensity = Math.min(1, Math.sqrt(x * x + y * y));
  cardEl.style.setProperty('--mx', mx + '%');
  cardEl.style.setProperty('--my', my + '%');
  cardEl.style.setProperty('--ang', ang);
  cardEl.style.setProperty('--intensity', intensity);
}
function tiltLoop() {
  cur.x += (target.x - cur.x) * 0.16;
  cur.y += (target.y - cur.y) * 0.16;
  applyTilt(cur.x, cur.y);
  rafId = requestAnimationFrame(tiltLoop);
}
function startTiltLoop() { if (!rafId) rafId = requestAnimationFrame(tiltLoop); }
function stopTiltLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

cardPersp.addEventListener('pointermove', (e) => {
  const rect = cardPersp.getBoundingClientRect();
  target.x = Math.max(-1, Math.min(1, ((e.clientX - rect.left) / rect.width - 0.5) * 2));
  target.y = Math.max(-1, Math.min(1, ((e.clientY - rect.top) / rect.height - 0.5) * 2));
});
cardPersp.addEventListener('pointerleave', () => { target.x = 0; target.y = 0; });

const gyroBtn = document.getElementById('gyroBtn');
function handleOrientation(e) {
  const gamma = Math.max(-45, Math.min(45, e.gamma || 0));
  const beta = Math.max(-45, Math.min(45, (e.beta || 0) - 45));
  target.x = gamma / 45; target.y = beta / 45;
}
gyroBtn.addEventListener('click', async () => {
  if (gyroOn) return;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted') { showToast('자이로 권한이 필요해요'); return; }
    }
    window.addEventListener('deviceorientation', handleOrientation);
    gyroOn = true;
    gyroBtn.textContent = '✅ 자이로 반짝이 켜짐';
  } catch (err) { showToast('이 기기에서는 자이로를 쓸 수 없어요'); }
});

goTo(0);
</script>
